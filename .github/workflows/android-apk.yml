name: Android APK
on:
  push:
    paths: ["brainpal-android/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brainpal-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: brainpal-counter-debug
          path: brainpal-android/app/build/outputs/apk/debug/app-debug.apk
